name: 更新 Glowmode 上新数据

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: write

concurrency:
  group: update-glowmode
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 抓取 Glowmode 新品
        run: node scripts/fetch-glowmode.mjs

      - name: 提交更新
        run: |
          if git diff --quiet -- glowmode.json; then
            echo "Glowmode 数据没有变化"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glowmode.json
          git commit -m "data: update Glowmode new arrivals"
          git push
